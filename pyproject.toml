[project]
name = "fafsa-edit-rule-processor"
version = "0.1.0"
description = "Rule-based FAFSA application validation API"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
